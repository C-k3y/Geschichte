<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent white flash on dark backgrounds before CSS loads -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0A08" />

    <!-- Primary SEO -->
    <title>SOIVANT — Wear Your Story</title>
    <meta
      name="description"
      content="SOIVANT — Wear Your Story. The Geschichte line launches soon: stories woven, purpose worn. Join the waitlist for early access."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soivant.co/" />
    <meta property="og:title" content="SOIVANT — Wear Your Story" />
    <meta
      property="og:description"
      content="The Geschichte line launches soon. Stories woven, purpose worn."
    />
    <meta property="og:image" content="https://soivant.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SOIVANT — Wear your story. Geschichte — Coming Soon." />
    <meta property="og:site_name" content="SOIVANT" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOIVANT — Wear Your Story" />
    <meta
      name="twitter:description"
      content="The Geschichte line launches soon. Stories woven, purpose worn."
    />
    <meta name="twitter:image" content="https://soivant.co/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Brand typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&family=Marck+Script&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Plausible Analytics (privacy-first, no cookie banner required)
         Set your domain in .env.local: VITE_PLAUSIBLE_DOMAIN=soivant.co
         This script tag is inlined; Vite will substitute the env var at build time. -->
    <!-- Uncomment when your Plausible account is ready:
    <script defer data-domain="soivant.co" src="https://plausible.io/js/script.js"></script>
    -->
  </head>
  <body class="bg-ink text-bone antialiased">
    <!-- Shown when JavaScript is disabled -->
    <noscript>
      <style>
        .ns {
          background: #0b0a08;
          color: #ede8dc;
          font-family: Georgia, serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          text-align: center;
          padding: 2rem;
          gap: 1rem;
        }
        .ns h1 { font-size: 2rem; letter-spacing: 0.3em; }
        .ns p { color: #6e655a; font-size: 0.9rem; max-width: 28rem; line-height: 1.7; }
        .ns a { color: #b99a66; }
      </style>
      <div class="ns">
        <h1>SOIVANT</h1>
        <p>
          Wear your story. — The Geschichte line is coming soon.<br />
          JavaScript is required to view this page.<br />
          Follow us on Instagram:
          <a href="https://instagram.com/soivant.co" rel="noreferrer">@soivant.co</a>
        </p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
